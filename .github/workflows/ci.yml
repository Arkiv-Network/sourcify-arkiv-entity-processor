name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  check:
    name: fmt, clippy, test, build
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7

      # Installs the toolchain and components pinned in rust-toolchain.toml.
      - name: Install Rust toolchain
        run: |
          rustup toolchain install
          rustup show active-toolchain
          cargo --version

      - uses: Swatinem/rust-cache@v2

      - name: Format
        run: cargo fmt --all --check

      - name: Clippy
        run: cargo clippy --workspace --locked --all-targets -- -D warnings

      - name: Install signature collation locale
        run: sudo localedef -i en_US -f UTF-8 en_US.UTF-8

      - name: Test
        run: cargo test --workspace --locked

      - name: Build release
        run: cargo build --workspace --release --locked

      - name: Smoke test
        run: |
          bin=target/release/arkiv-entity-processor
          "$bin" --version
          target/release/arkiv-sourcify-server --version
          target/release/arkiv-sourcify-server --help >/dev/null
          "$bin" process --help >/dev/null
          # One minimal record plus its completion marker, then verify the bundle.
          printf '%s\n' \
            '{"chainId":"1","address":"0x1111111111111111111111111111111111111111","matchId":"1","verifiedAt":"2020-01-01T00:00:00Z","abi":[],"compilation":{"language":"Solidity","compiler":"solc","compilerVersion":"1","compilerSettings":{},"fullyQualifiedName":"A.sol:A"},"sources":{"A.sol":{"content":"contract A {}"}},"creationBytecode":{"onchainBytecode":null,"recompiledBytecode":null},"runtimeBytecode":{"onchainBytecode":"0x6000","recompiledBytecode":"0x6000"}}' \
            '{"type":"source-complete","records":1}' \
            | "$bin" process --require-source-complete --output "$RUNNER_TEMP/bundle" \
                --owner 0x1111111111111111111111111111111111111111
          "$bin" verify "$RUNNER_TEMP/bundle"
          (cd "$RUNNER_TEMP/bundle" && sha256sum -c SHA256SUMS)

      - name: Arkiv RPC HTTP smoke test
        run: python3 tests/server-smoke.py

      - name: Offline live-comparison client tests
        run: PYTHONDONTWRITEBYTECODE=1 python3 -m unittest discover -s tests/live -p 'test_*.py'

  pipeline:
    name: pipeline end-to-end (PostgreSQL + Bun + DuckDB + processor)
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    # The tests load tests/fixture into a schema of their own (tests/fixture/postgres.ts).
    services:
      postgres:
        image: postgres:15.14-bookworm
        env:
          POSTGRES_PASSWORD: test
        ports: ["5432:5432"]
        options: --health-cmd pg_isready --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      PGHOST: 127.0.0.1
      PGPORT: "5432"
      PGDATABASE: postgres
      PGUSER: postgres
      PGPASSWORD: test
    steps:
      - uses: actions/checkout@v7

      - name: Install Rust toolchain
        run: |
          rustup toolchain install
          rustup show active-toolchain

      - uses: Swatinem/rust-cache@v2

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.2

      - name: Install source stage dependencies
        run: bun install --frozen-lockfile

      - name: Build release
        run: cargo build --workspace --release --locked

      # Adapter NDJSON compatibility, decoded payload parity, and build-aware pipeline reuse/refusal.
      - name: End-to-end tests
        run: bun run test

  docker:
    name: docker image on the fixture
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    services:
      postgres:
        image: postgres:15.14-bookworm
        env:
          POSTGRES_PASSWORD: test
        ports: ["5432:5432"]
        options: --health-cmd pg_isready --health-interval 5s --health-timeout 5s --health-retries 10
    steps:
      - uses: actions/checkout@v7

      - name: Build image
        run: docker build --build-arg REVISION="${GITHUB_SHA::7}" -t arkiv-entity-processor:ci .

      - name: Load the fixture into PostgreSQL
        run: |
          { echo 'CREATE SCHEMA fixture; SET search_path TO fixture;'; cat tests/fixture/schema.sql tests/fixture/fixture.sql; } |
            docker exec -i "${{ job.services.postgres.id }}" psql -v ON_ERROR_STOP=1 -q -U postgres -d postgres

      - name: Run the pipeline on the fixture
        run: |
          work="$RUNNER_TEMP/work"
          mkdir -p "$work"
          owner="$(jq -r .owner tests/fixture/expected.json)"
          # prepare is the only phase that reaches the database; run then needs no network.
          docker run --rm --network host -u "$(id -u):$(id -g)" -v "$work:/work" \
            -e PGHOST=127.0.0.1 -e PGPORT=5432 -e PGDATABASE=postgres -e PGUSER=postgres -e PGPASSWORD=test -e PG_SCHEMA=fixture \
            -e ENTITY_OWNER="$owner" -e PREPARE_MEMORY_LIMIT=2GB \
            arkiv-entity-processor:ci prepare
          docker run --rm --network none -u "$(id -u):$(id -g)" -v "$work:/work" \
            -e ENTITY_OWNER="$owner" -e PG_SCHEMA=fixture -e SOURCE_MEMORY_LIMIT=1GB \
            arkiv-entity-processor:ci run
          # The current bundle retains complete input contract payloads and nullable records.
          # Pipeline tests decode gzip/spill entities and compare every adapter input.
          docker run --rm --network none --entrypoint arkiv-entity-processor \
            -v "$work:/work:ro" arkiv-entity-processor:ci verify /work/bundle
          (cd "$work/bundle" && sha256sum -c SHA256SUMS)
          jq -e '.status == "completed" and .records.contracts == 16 and .records.sourceSkipped == 2' "$work/timings.json"
          jq '{status, records, phases: (.phases | map_values(.status))}' "$work/timings.json"
