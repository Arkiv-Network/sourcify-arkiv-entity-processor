# Sourcify PostgreSQL database -> Arkiv prefill seed bundle -> R2. See README.md, "Run with Docker Compose".
#
#   docker compose --profile prepare run --rm prepare   # database -> WORK_DIR/source (only this one reaches the database)
#   docker compose up pipeline                          # offline: process -> verify (no network)
#   docker compose --profile publish run --rm publish   # pack -> upload to R2 -> read back and check
#   docker compose --profile sync up -d sync            # Postgres -> Arkiv: new matches after the cursor, continuously
#
# Settings come from .env (copy .env.example). Rerunning a command resumes; completed phases are reused.
name: arkiv-entity-processor

x-environment: &environment
  # docker stop signals the whole job (DuckDB, Bun, Rust), so the failure is recorded in timings.json.
  TINI_KILL_PROCESS_GROUP: "1"
  WORK_DIR: /work
  PG_SCHEMA: "${PG_SCHEMA:-public}"
  ENTITY_OWNER: "${ENTITY_OWNER:?Set ENTITY_OWNER in .env to the public owner address of every entity}"
  DESTINATION_CHAIN_ID: "${DESTINATION_CHAIN_ID:-7706815}"
  PREPARE_LIMIT: "${PREPARE_LIMIT:-}"
  PREPARE_THREADS: "${PREPARE_THREADS:-8}"
  PREPARE_MEMORY_LIMIT: "${PREPARE_MEMORY_LIMIT:-24GB}"
  SOURCE_BATCH_SIZE: "${SOURCE_BATCH_SIZE:-250}"
  SOURCE_MEMORY_LIMIT: "${SOURCE_MEMORY_LIMIT:-6GB}"
  CONTRACT_LIMIT: "${CONTRACT_LIMIT:-}"
  SKIP_MISSING_REFERENCES: "${SKIP_MISSING_REFERENCES:-1}"
  MAX_SKIPPED: "${MAX_SKIPPED:-100000}"
  PROCESS_WORKERS: "${PROCESS_WORKERS:-4}"
  COMPRESSION_WORKERS: "${COMPRESSION_WORKERS:-4}"
  PROGRESS_INTERVAL: "${PROGRESS_INTERVAL:-60}"

x-pipeline: &pipeline
  image: arkiv-entity-processor:local
  build:
    context: .
    args:
      REVISION: "${REVISION:-}"
  init: true
  restart: "no"
  user: "${PIPELINE_UID:-1000}:${PIPELINE_GID:-1000}"
  cpus: "${PIPELINE_CPUS:-12}"
  mem_limit: "${PIPELINE_MEMORY:-48g}"
  # No swap beyond the memory limit: an over-budget phase fails (and resumes) instead of thrashing.
  memswap_limit: "${PIPELINE_MEMORY:-48g}"
  pids_limit: 512
  # On a shared host the kernel picks these containers first, should it ever run out of memory.
  oom_score_adj: 500
  stop_grace_period: 30s
  volumes:
    - type: bind
      source: "${WORK_DIR:-./data/work}"
      target: /work

services:
  # Reads the Sourcify database (a role with SELECT on its tables suffices) on its Docker network; no ports.
  prepare:
    <<: *pipeline
    profiles: [prepare]
    command: ["prepare"]
    networks: [source]
    environment:
      <<: *environment
      PGHOST: "${PGHOST:-db}"
      PGPORT: "${PGPORT:-5432}"
      PGDATABASE: "${PGDATABASE:-sourcify}"
      PGUSER: "${PGUSER:-sourcify_export}"
      PGPASSFILE: /run/secrets/pgpass
    secrets:
      - source: pgpass
        target: pgpass

  pipeline:
    <<: *pipeline
    command: ["run"]
    network_mode: none
    environment:
      <<: *environment

  publish:
    <<: *pipeline
    profiles: [publish]
    command: ["publish"]
    environment:
      <<: *environment
      R2_BUCKET: "${R2_BUCKET:-}"
      R2_KEY: "${R2_KEY:-}"
      R2_CREDENTIALS_FILE: /run/secrets/r2
      PACK_CONTENTS: "${PACK_CONTENTS:-prefill}"
      ZSTD_LEVEL: "${ZSTD_LEVEL:-3}"
      PACK_THREADS: "${PACK_THREADS:-8}"
      UPLOAD_CONCURRENCY: "${UPLOAD_CONCURRENCY:-8}"
      UPLOAD_PART_SIZE_MIB: "${UPLOAD_PART_SIZE_MIB:-64}"
    secrets:
      - source: r2
        target: r2

  # Postgres -> Arkiv sync (arkiv/sync.ts): reads the database like prepare, writes to the Arkiv RPC (outbound only,
  # no ports). Safe to restart at any point: it looks entities up on the chain again instead of creating them twice.
  sync:
    <<: *pipeline
    profiles: [sync]
    entrypoint: ["bun", "/app/arkiv/sync.ts"]
    command: []
    restart: unless-stopped
    cpus: "${SYNC_CPUS:-2}"
    mem_limit: "${SYNC_MEMORY:-3g}"
    memswap_limit: "${SYNC_MEMORY:-3g}"
    pids_limit: 256
    networks: [source, default]
    environment:
      TINI_KILL_PROCESS_GROUP: "1"
      PGHOST: "${PGHOST:-db}"
      PGPORT: "${PGPORT:-5432}"
      PGDATABASE: "${PGDATABASE:-sourcify}"
      PGUSER: "${PGUSER:-sourcify_export}"
      PGPASSFILE: /run/secrets/pgpass
      ARKIV_RPC_URL: "${ARKIV_RPC_URL:?Set ARKIV_RPC_URL in .env to the Arkiv RPC the sync writes to}"
      ARKIV_CHAIN_ID: "${ARKIV_CHAIN_ID:-}"
      ARKIV_PRIVATE_KEY_FILE: /run/secrets/arkiv_writer_key
      ARKIV_PROCESSOR_BIN: /usr/local/bin/arkiv-entity-processor
      SYNC_DIR: /sync
      SYNC_BATCH: "${SYNC_BATCH:-200}"
      SYNC_POLL_SECONDS: "${SYNC_POLL_SECONDS:-60}"
      SYNC_MAX_GAS_PRICE_GWEI: "${SYNC_MAX_GAS_PRICE_GWEI:-2}"
      SYNC_IN_FLIGHT: "${SYNC_IN_FLIGHT:-4}"
    volumes:
      - type: bind
        source: "${SYNC_DIR:-./data/sync}"
        target: /sync
    secrets:
      - source: pgpass
        target: pgpass
      - source: arkiv_writer_key
        target: arkiv_writer_key

networks:
  default: {}
  source:
    # The network of the database service, e.g. the sourcify-mirror-node's Compose project.
    external: true
    name: "${SOURCE_NETWORK:-sourcify-node_default}"

secrets:
  pgpass:
    # libpq password file (host:port:database:user:password, mode 600, readable by PIPELINE_UID). Mounted read-only;
    # never part of the image, logs, environment or command lines.
    file: "${PG_PASSFILE:-./pgpass}"
  r2:
    # AWS_ACCESS_KEY_ID, AWS_SECRET_ACCESS_KEY, AWS_ENDPOINT_URL_S3 (and optionally AWS_DEFAULT_REGION) lines;
    # readable by PIPELINE_UID. Mounted read-only; never part of the image, logs or command lines.
    file: "${R2_CREDENTIALS_FILE:-./r2.env}"
  arkiv_writer_key:
    # The sync's writer: a 32-byte hex private key (mode 600, readable by PIPELINE_UID). Its address owns every entity
    # the sync creates and must be the owner the server reads. Never run another signer with this key.
    file: "${ARKIV_WRITER_KEY_FILE:-./arkiv-writer.key}"
