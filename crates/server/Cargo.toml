[package]
name = "arkiv-sourcify-server"
version = "0.1.0"
edition = "2021"
rust-version = "1.90"
description = "Arkiv-backed Sourcify Mainnet contract read service"
publish = false

[dependencies]
anyhow = "1"
futures-util = "0.3"
hex = "0.4"
libc = "0.2"
sha3 = "0.10"
uuid = { version = "1", features = ["v4"] }
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "json", "stream"] }
arkiv-entity-processor = { path = "../.." }
axum = { version = "0.8.9", default-features = false, features = ["http1", "json", "tokio"] }
clap = { version = "4", features = ["derive"] }
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["preserve_order", "arbitrary_precision"] }
tokio = { version = "1.53.1", features = ["rt-multi-thread", "macros", "net", "signal", "sync", "time"] }
tower-http = { version = "0.6.11", default-features = false, features = ["compression-gzip", "compression-zstd"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

[dev-dependencies]
flate2 = "1"
tower = { version = "0.5", features = ["util"] }
zstd = { version = "0.14", default-features = false }
